name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skill references are in sync with rules/, guides/, archetypes/
        run: node scripts/sync-skill.mjs --check
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .cursor-plugin/*.json .agents/plugins/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid: $f"; exit 1; }
          done
